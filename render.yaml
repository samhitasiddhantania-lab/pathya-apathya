# Render "Blueprint" file — optional. If you connect this repo to Render
# and it detects render.yaml, it will pre-fill a free web service for you.
# You still need to fill in MONGODB_URI and ADMIN_API_KEY manually in the
# Render dashboard (Environment tab) — never commit real secrets here.

services:
  - type: web
    name: pathya-apathya-advisor-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 10000
